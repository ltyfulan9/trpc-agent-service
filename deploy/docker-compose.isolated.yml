# Optional local acceptance overlay. It changes only host-published ports so a
# V14 stack can run beside an existing V13 project. Compose v2.24.4+ is
# required for !override. Internal service names and ports remain unchanged.
services:
  postgres:
    ports: !override
      - "127.0.0.1:${V14_POSTGRES_PORT:-65432}:5432"
  otel-collector:
    ports: !override
      - "127.0.0.1:${V14_OTLP_GRPC_PORT:-64317}:4317"
      - "127.0.0.1:${V14_OTLP_HTTP_PORT:-64318}:4318"
  gateway:
    ports: !override
      - "127.0.0.1:${V14_GATEWAY_PORT:-18080}:8080"
  admin:
    ports: !override
      - "127.0.0.1:${V14_ADMIN_PORT:-18081}:8081"
  prometheus:
    ports: !override
      - "127.0.0.1:${V14_PROMETHEUS_PORT:-19095}:9090"
  grafana:
    ports: !override
      - "127.0.0.1:${V14_GRAFANA_PORT:-13000}:3000"
